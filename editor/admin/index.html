<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel | Yukie Yahiro</title>
<meta name="description" content="Painel da Yukie Yahiro.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c6f24e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =========================================================
   CORES E MEDIDAS (as mesmas do portfólio Editor flutuante)
   ========================================================= */
:root{
  --bg:#f3f4f2; --card:#fff; --ink:#111; --muted:#4d524b; --line:#e2e4df; --line-2:#eceee9;
  --lime:#c6f24e; --lime-deep:#a9d62c; --lime-soft:#eefbc9;
  --radius:22px; --radius-sm:14px; --radius-xs:10px;
  --shadow-sm:0 1px 2px rgba(17,17,17,.04),0 6px 18px -8px rgba(17,17,17,.14);
  --shadow:0 1px 2px rgba(17,17,17,.05),0 18px 40px -16px rgba(17,17,17,.22);
  --menu:236px;
  /* cores das pílulas */
  --cinza-bg:#eceeea; --cinza:#454a43;
  --lilas-bg:#ece8fb; --lilas:#4b36a8;
  --azul-bg:#e3effd; --azul:#1a549e;
  --ambar-bg:#fff2c2; --ambar:#6f4e00;
  --rosa-bg:#fbe4ee; --rosa:#8f1d4f;
  --verm-bg:#fdecec; --verm:#a3161a;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Portão: a página só aparece depois de conferir a sessão */
.portao{min-height:100vh;display:grid;place-items:center;color:var(--muted);font-weight:600;padding:20px;text-align:center}
body.travado .app{display:none}
body:not(.travado) .portao{display:none}

/* ============ ESTRUTURA ============ */
.app{min-height:100vh}
.menu{position:fixed;inset:0 auto 0 0;width:var(--menu);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;z-index:40;transition:transform .25s ease}
.marca-painel{display:flex;align-items:center;gap:10px;font-weight:800;font-size:.95rem;padding:4px 10px 18px}
.ponto{width:11px;height:11px;border-radius:50%;background:var(--lime);border:2px solid var(--ink);flex:none}
.grupo{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 6px}
.menu nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-xs);text-decoration:none;font-weight:600;color:var(--muted);margin-bottom:2px}
.menu nav a:hover{background:var(--bg);color:var(--ink)}
.menu nav a[aria-current="page"]{background:var(--lime-soft);color:var(--ink);box-shadow:inset 0 0 0 1px #dff3a6}
.menu nav a[aria-current="page"] svg{color:#5d7a00}
.menu-pe{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 2px}
.menu-pe small{display:block;color:var(--muted);font-size:.72rem}
.menu-pe b{display:block;font-size:.8rem;font-weight:700;word-break:break-all;margin:2px 0 10px}
.btn-sair{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-xs);padding:7px 12px;font-weight:700;font-size:.82rem;cursor:pointer}
.btn-sair:hover{background:var(--bg)}
.veu{display:none}

.conteudo{margin-left:var(--menu);padding:22px 28px 60px;min-width:0}
.cabeca{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.cabeca h1{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.cabeca p{color:var(--muted);font-size:.84rem}
.cabeca .ver-site{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:var(--radius-xs)}
.btn-menu{display:none;width:38px;height:38px;border-radius:var(--radius-xs);border:1px solid var(--line);background:var(--card);align-items:center;justify-content:center;cursor:pointer;flex:none}

@media (max-width:900px){
  .menu{transform:translateX(-100%);box-shadow:var(--shadow)}
  .menu.aberto{transform:none}
  .veu.aberto{display:block;position:fixed;inset:0;background:rgba(17,17,17,.35);z-index:35}
  .conteudo{margin-left:0;padding:14px 14px 50px}
  .btn-menu{display:inline-flex}
  .cabeca .ver-site span{display:none}
}

/* ============ AVISOS ============ */
#avisos{display:grid;gap:8px;margin-bottom:14px}
#avisos:empty{display:none}
.aviso{display:flex;align-items:flex-start;gap:10px;background:var(--ambar-bg);color:var(--ambar);border:1px solid #f3dc86;border-radius:var(--radius-sm);padding:10px 12px;font-weight:600;font-size:.84rem}
.aviso.erro{background:var(--verm-bg);color:var(--verm);border-color:#f6c9c9}
.aviso button{margin-left:auto;background:none;border:0;cursor:pointer;color:inherit;padding:0 2px;font-weight:800}

/* ============ PEÇAS COMUNS ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.bloco{padding:18px;margin-bottom:16px}
.bloco-topo{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.bloco-topo h2{font-size:.95rem;font-weight:800}
.bloco-topo .dir{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 12px;border-radius:var(--radius-xs);border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.82rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.escuro{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.escuro:hover{background:#2a2a2a}
.btn.perigo{color:var(--verm);border-color:#f3c7c7}
.btn.perigo:hover{background:var(--verm-bg)}
.btn svg.i{width:16px;height:16px}
.icone{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--muted)}
.icone:hover{background:var(--bg);color:var(--ink)}
.icone svg.i{width:17px;height:17px}
.vazio{color:var(--muted);font-size:.86rem;padding:18px;text-align:center;background:var(--bg);border-radius:var(--radius-sm)}
.tag-ex{display:inline-block;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--ambar-bg);color:var(--ambar);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.pilula{display:inline-block;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-cinza{background:var(--cinza-bg);color:var(--cinza)}
.p-lilas{background:var(--lilas-bg);color:var(--lilas)}
.p-azul{background:var(--azul-bg);color:var(--azul)}
.p-ambar{background:var(--ambar-bg);color:var(--ambar)}
.p-rosa{background:var(--rosa-bg);color:var(--rosa)}
.p-verde{background:var(--lime-soft);color:#3b5200}
.p-lima{background:var(--lime);color:var(--ink)}
.p-verm{background:var(--verm-bg);color:var(--verm)}

.campo-busca{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-xs);padding:0 10px;min-height:34px}
.campo-busca input{border:0;outline:0;background:none;min-width:0;width:190px;font-size:.84rem}
.campo-busca:focus-within{border-color:var(--ink)}
select.filtro{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-xs);min-height:34px;padding:0 8px;font-size:.84rem;font-weight:600}
.seg{display:inline-flex;background:var(--bg);border-radius:var(--radius-xs);padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:5px 12px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}

/* Faixa de números */
.faixa{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));margin-bottom:16px;overflow:hidden}
.faixa > div{padding:14px 16px;border-left:1px solid var(--line-2);min-width:0}
.faixa > div:first-child{border-left:0}
.faixa small{display:block;color:var(--muted);font-size:.74rem;font-weight:600}
.faixa b{display:block;font-size:1.1rem;font-weight:800;letter-spacing:-.02em;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.faixa em{display:block;font-style:normal;color:var(--muted);font-size:.74rem;margin-top:2px}
@media (max-width:760px){.faixa{grid-template-columns:repeat(2,minmax(0,1fr))}.faixa > div{border-left:0;border-top:1px solid var(--line-2)}.faixa > div:nth-child(-n+2){border-top:0}.faixa > div:nth-child(even){border-left:1px solid var(--line-2)}}

/* Tabelas */
.tabela-rola{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clicavel{cursor:pointer}
tr.clicavel:hover td{background:#fafbf8}
td.acoes{white-space:nowrap;text-align:right}
td .fraco{color:var(--muted)}
td.trunca{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}

/* ============ PORTFÓLIO ============ */
.duas{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media (max-width:1000px){.duas{grid-template-columns:1fr}}
.grafico{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px}
.grafico .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.grafico .barra{width:100%;max-width:30px;background:var(--lime);border:1px solid var(--lime-deep);border-radius:6px 6px 3px 3px;min-height:3px;position:relative}
.grafico .barra.zero{background:var(--line-2);border-color:var(--line-2)}
.grafico .barra span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:.68rem;font-weight:800}
.grafico .dia{font-size:.66rem;color:var(--muted);margin-top:5px;font-weight:600}
.grafico .col.hoje .dia{color:var(--ink);font-weight:800}
.origens li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin-bottom:10px;font-size:.84rem}
.origens li b{font-weight:700}
.origens li span{color:var(--muted);font-variant-numeric:tabular-nums}
.origens li i{grid-column:1/-1;height:6px;border-radius:6px;background:var(--line-2);overflow:hidden}
.origens li i::before{content:"";display:block;height:100%;width:var(--p);background:var(--lime-deep);border-radius:6px}
.alca{cursor:grab;touch-action:none;color:#9aa096}
.alca:active{cursor:grabbing}
tr.arrastando td{background:var(--lime-soft)!important}
.olho[aria-pressed="false"]{color:#b2b7ae}

/* ============ MARCAS ============ */
.contagem{color:var(--muted);font-size:.8rem;font-weight:600}
.zap{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:.72rem;font-weight:800;background:var(--lime-soft);color:#3b5200;border-radius:999px;padding:2px 8px;text-decoration:none}
.zap:hover{background:var(--lime)}
.insta{text-decoration:none;font-weight:700}
.insta:hover{text-decoration:underline}

/* ============ CALENDÁRIO ============ */
.cal-topo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.cal-topo h2{font-size:.98rem;font-weight:800;min-width:150px}
.grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--line-2);gap:1px}
.grade .sem{background:var(--card);font-size:.7rem;font-weight:800;text-transform:uppercase;color:var(--muted);padding:6px 8px;letter-spacing:.04em}
.dia-cel{background:var(--card);min-height:104px;padding:6px;position:relative;cursor:pointer;min-width:0}
.dia-cel:hover{background:#fafbf8}
.dia-cel.fora{background:#f8f9f6}
.dia-cel.fora .n{color:#b5bab1}
.dia-cel .n{font-size:.78rem;font-weight:700;display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px}
.dia-cel.hoje .n{background:var(--ink);color:#fff}
.dia-cel.hoje{box-shadow:inset 0 0 0 2px var(--lime-deep)}
.mais-dia{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;opacity:0;cursor:pointer;color:var(--ink)}
.mais-dia svg.i{width:14px;height:14px}
.dia-cel:hover .mais-dia,.mais-dia:focus-visible{opacity:1}
.itens-dia{display:grid;gap:3px;margin-top:4px}
.item-cal{display:block;width:100%;text-align:left;border:0;border-left:3px solid;border-radius:5px;padding:2px 6px;font-size:.72rem;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-gravar{background:var(--lime-soft);border-color:var(--lime-deep);color:#2f4200}
.t-editar{background:var(--lilas-bg);border-color:#8a74e0;color:var(--lilas)}
.t-postar{background:var(--azul-bg);border-color:#5b95dc;color:var(--azul)}
.t-prazo{background:var(--verm-bg);border-color:#e57373;color:var(--verm)}
.t-particular{background:#eff0ed;border-color:#b9beb4;color:#454a43}
.dia-cel .rot-sem{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-right:4px}
.grade.semana-v .dia-cel{min-height:340px}
.grade.semana-v .item-cal{white-space:normal;font-size:.78rem;padding:5px 7px;line-height:1.3}
.grade.semana-v .item-cal small{display:block;font-weight:600;opacity:.8;font-size:.7rem}
.item-cal.feito{text-decoration:line-through;opacity:.55}
.ver-mais{border:0;background:none;padding:1px 6px;font-size:.72rem;font-weight:800;color:var(--muted);cursor:pointer;text-align:left}
.ver-mais:hover{color:var(--ink);text-decoration:underline}
.legenda-cal{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:.76rem;color:var(--muted);font-weight:600}
.legenda-cal span{display:inline-flex;align-items:center;gap:6px}
.legenda-cal i{width:10px;height:10px;border-radius:3px;border-left:3px solid}
.atrasados li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:.84rem}
.atrasados li:last-child{border-bottom:0}
.atrasados .quando{margin-left:auto;white-space:nowrap}
@media (max-width:700px){
  .dia-cel{min-height:62px;padding:4px}
  .grade.mes-v .item-cal{font-size:0;height:6px;padding:0;border-left-width:0;border-radius:3px}
  .grade.semana-v{grid-template-columns:1fr}
  .grade.semana-v .dia-cel{min-height:0;padding:8px 10px}
  .grade.semana-v .mais-dia{display:grid;opacity:1}
  .ver-mais{font-size:.62rem;padding:0}
  .mais-dia{display:none}
  .grade .sem{padding:5px 2px;text-align:center;font-size:.62rem}
}

/* ============ CAMPANHAS ============ */
th button.ordena{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
th button.ordena .seta{font-size:.72rem;color:#c3c7bf}
th[aria-sort="ascending"] .seta,th[aria-sort="descending"] .seta{color:var(--ink)}
th[aria-sort="ascending"],th[aria-sort="descending"]{color:var(--ink)}
tr.fav td:first-child{box-shadow:inset 4px 0 0 var(--lime-deep)}
tr.fav td{background:#fbfdf4}
.estrela{color:#c3c7bf}
.estrela[aria-pressed="true"]{color:#8fb400}
.estrela[aria-pressed="true"] svg.i{fill:var(--lime);stroke:#6f8c00}
.prazo-tag{display:inline-block;margin-left:6px;font-size:.68rem;font-weight:800;border-radius:6px;padding:1px 6px;white-space:nowrap}
.prazo-tag.atraso{background:var(--verm-bg);color:var(--verm)}
.prazo-tag.perto{background:var(--ambar-bg);color:var(--ambar)}

/* ============ CHECKLIST ============ */
.subabas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.subabas button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--muted)}
.subabas button[aria-selected="true"]{background:var(--lime-soft);border-color:#dff3a6;color:var(--ink)}
.progresso{height:7px;border-radius:7px;background:var(--line-2);overflow:hidden}
.progresso i{display:block;height:100%;width:0;background:var(--lime-deep);border-radius:7px;transition:width .3s ease}
.geral{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:12px}
.geral b{font-size:.9rem;white-space:nowrap}
.geral .progresso{flex:1}
details.sec{margin-bottom:10px;overflow:hidden}
details.sec > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px;padding:14px 18px}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary .emo{font-size:1.2rem}
details.sec > summary h3{font-size:.92rem;font-weight:800}
details.sec > summary p{font-size:.8rem;color:var(--muted);grid-column:2}
details.sec > summary .conta{font-size:.76rem;font-weight:800;color:var(--muted);grid-row:1/3;grid-column:3;text-align:right;min-width:90px}
details.sec > summary .conta .progresso{margin-top:6px}
details.sec[open] > summary{border-bottom:1px solid var(--line-2)}
.sec-corpo{padding:14px 18px 16px}
.porque{background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;font-size:.84rem;margin-bottom:12px}
.porque b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.item-ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.item-ck:last-child{border-bottom:0}
.item-ck input{width:17px;height:17px;margin:2px 0 0;accent-color:#6f8c00;flex:none;cursor:pointer}
.item-ck b{display:block;font-size:.86rem;font-weight:700}
.item-ck small{display:block;color:var(--muted);font-size:.8rem}
.item-ck input:checked + span b{text-decoration:line-through;color:var(--muted)}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ref{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:8px;text-align:left;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .2s ease}
.ref:hover{transform:translateY(-3px)}
.ref .capa{aspect-ratio:9/16;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:2.6rem;position:relative}
.ref .capa .dur{position:absolute;bottom:8px;right:8px;background:rgba(255,255,255,.9);font-size:.7rem;font-weight:800;border-radius:6px;padding:1px 6px}
.ref h3{font-size:.86rem;font-weight:800;margin:10px 4px 4px}
.ref p{font-size:.76rem;color:var(--muted);margin:0 4px 4px}
.ficha-sec{margin-top:14px}
.ficha-sec b.rot{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}
.gancho{background:var(--lime-soft);border-radius:var(--radius-sm);padding:10px 12px;font-weight:700}
.beats{display:grid;gap:8px}
.beat{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:start;background:var(--bg);border-radius:var(--radius-xs);padding:8px 10px;font-size:.84rem}
.beat .t{font-size:.72rem;font-weight:800;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 6px;text-align:center}
.lista-erros{padding-left:18px;list-style:disc;font-size:.84rem;color:var(--muted)}
.nichos-ideias{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.nichos-ideias .card{padding:16px}
.nichos-ideias h3{font-size:.92rem;font-weight:800;margin-bottom:10px}
.ideia{padding:8px 0;border-bottom:1px solid var(--line-2);font-size:.84rem}
.ideia:last-child{border-bottom:0}
.ideia b{display:block}
.ideia q{display:block;color:var(--muted);font-style:italic;margin-top:2px}
.como-usar li{position:relative;padding-left:16px;margin-bottom:6px;font-size:.84rem}
.como-usar li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--lime-deep)}
.revisar{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:900px){.revisar{grid-template-columns:1fr}}
.revisar textarea{width:100%;min-height:360px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;background:var(--bg);resize:vertical;font-size:.88rem;line-height:1.6}
.revisar textarea:focus{outline:none;border-color:var(--ink);background:#fff}

/* ============ HOJE, TAREFAS, IDEIAS, RADAR E LINKS ============ */
.saudacao{margin-bottom:14px}
.saudacao h2{font-size:1rem;font-weight:800}
.saudacao p{color:var(--muted);font-size:.84rem}
.rapido{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px}
.rapido.sem-borda{padding:0 0 10px}
.rapido input:not([type=date]){flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:var(--radius-xs);min-height:36px;padding:0 12px;font-size:.88rem}
.rapido input:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px var(--lime)}
input.filtro{padding:0 8px}
.lista-tarefas li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.lista-tarefas li:last-child{border-bottom:0}
.lista-tarefas input[type=checkbox]{width:18px;height:18px;accent-color:#6f8c00;cursor:pointer;flex:none;margin:0}
.tarefa-t{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;font-weight:600;font-size:.88rem;cursor:pointer}
.lista-tarefas li.feita .tarefa-t{text-decoration:line-through;color:var(--muted)}
.mini-lista li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:.84rem}
.mini-lista li:last-child{border-bottom:0}
.mini-lista .dir-item{margin-left:auto;white-space:nowrap}
.quadro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1000px){.quadro{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.quadro{grid-template-columns:1fr}}
.coluna{background:#eceee9;border-radius:var(--radius);padding:10px}
.coluna h3{font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 6px 10px;display:flex;gap:6px;align-items:center}
.coluna h3 span{background:var(--card);border-radius:999px;padding:0 8px;font-size:.72rem}
.coluna .vazio{padding:10px;font-size:.78rem;background:none}
.ideia-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow-sm)}
.ideia-card:hover{border-color:#cfd3c9}
.ideia-card b{display:block;font-size:.86rem}
.ideia-card p{font-size:.8rem;color:var(--muted);margin-top:4px}
.ideia-card .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ideia-card .acoes-card{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ideia-card .acoes-card:empty{display:none}
.ideia-card .acoes-card .btn{min-height:28px;padding:0 8px;font-size:.74rem}
.fontes{display:flex;flex-wrap:wrap;gap:8px}
.fontes a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;text-decoration:none;background:var(--card)}
.fontes a:hover{background:var(--lime-soft);border-color:#dff3a6}
.fontes svg.i{width:13px;height:13px}
.grade-radar{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.radar-card{padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.radar-card:hover{border-color:#cfd3c9}
.radar-card.fixada{box-shadow:inset 0 3px 0 var(--lime-deep),var(--shadow-sm)}
.radar-card h3{font-size:.92rem;font-weight:800;line-height:1.3}
.radar-card .nota{font-size:.82rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.radar-topo,.radar-pe{display:flex;align-items:center;gap:6px}
.radar-topo .icone{margin-left:auto}
.radar-pe{margin-top:auto;flex-wrap:wrap}
.radar-pe select{border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.76rem;font-weight:700;padding:3px 6px}
.radar-pe .btn{margin-left:auto;min-height:28px;font-size:.76rem}
.fixa[aria-pressed="true"]{color:#6f8c00}
.fixa[aria-pressed="true"] svg.i{fill:var(--lime)}
.grupos-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.grupos-links section.card{padding:14px 16px}
.grupos-links h2{font-size:.88rem;font-weight:800;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.grupos-links h2 span{color:var(--muted);font-weight:700;font-size:.74rem}
.link-li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.link-li:last-child{border-bottom:0}
.letra{width:32px;height:32px;border-radius:9px;background:var(--lime-soft);display:grid;place-items:center;font-weight:800;font-size:.84rem;flex:none}
.link-li > div{flex:1;min-width:0}
.link-li a{font-weight:700;font-size:.86rem;text-decoration:none}
.link-li a:hover{text-decoration:underline}
.link-li small{display:block;color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ JANELA (MODAL) ============ */
.fundo-modal{position:fixed;inset:0;z-index:80;background:rgba(17,17,17,.45);display:grid;place-items:center;padding:16px}
.modal{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.modal.largo{max-width:680px}
.modal-topo{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.modal-topo h2{font-size:1rem;font-weight:800;letter-spacing:-.01em}
.modal-topo p{font-size:.8rem;color:var(--muted)}
.modal-topo .icone{margin-left:auto}
.form-grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grade .inteiro{grid-column:1/-1}
@media (max-width:520px){.form-grade{grid-template-columns:1fr}}
.campo label{display:block;font-weight:700;font-size:.78rem;margin-bottom:4px}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--radius-xs);padding:8px 10px;font-size:.86rem}
.campo textarea{min-height:90px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px var(--lime)}
.campo.check label{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:600;cursor:pointer;margin:0}
.campo.check input{width:17px;height:17px;accent-color:#6f8c00}
.campo .dica{font-size:.74rem;color:var(--muted);margin-top:3px}
.modal-pe{display:flex;align-items:center;gap:8px;margin-top:18px}
.modal-pe .dir{margin-left:auto;display:flex;gap:8px}
.erro-form{color:var(--verm);font-weight:700;font-size:.8rem;margin-top:10px}
.lista-dia li{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lista-dia .item-cal{font-size:.84rem;padding:7px 10px}

/* Aviso rápido no canto */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;font-size:.84rem;z-index:90;box-shadow:var(--shadow)}
</style>

var TABELAS_NOVAS = ["tarefas", "ideias", "radar", "links"];
function arquivoSql(tabela) { return TABELAS_NOVAS.indexOf(tabela) > -1 ? "banco-novas-abas.sql" : "banco.sql"; }
function explicaErro(tabela, erro) {
  var c = (erro && erro.code) || "", m = (erro && (erro.message || String(erro))) || "";
  if (/jwt|token.*expired|not authenticated/i.test(m)) { location.replace("../login/"); return ""; }
  if (c === "42703" || c === "PGRST204" || /column/i.test(m)) {
    var campo = (m.match(/column\s+"?([\w.]+)"?/i) || m.match(/'(\w+)' column/i) || [])[1] || "";
    return 'Falta um campo na tabela "' + tabela + '"' + (campo ? " (" + campo.replace(/^\w+\./, "") + ")" : "") + ". Rode o " + arquivoSql(tabela) + " de novo no Supabase para completar. O resto do painel continua funcionando.";
  }
  if (c === "42P01" || c === "PGRST205" || /does not exist|could not find the table/i.test(m)) return 'A tabela "' + tabela + '" não foi encontrada no banco. Rode o ' + arquivoSql(tabela) + ' no Supabase para criá-la. O resto do painel continua funcionando.';
  if (c === "42501" || /permission|row-level/i.test(m)) return 'O banco não deixou mexer na tabela "' + tabela + '". Confira se você entrou com o e-mail ayyahiro@gmail.com e se o banco.sql foi rodado.';
  if (/fetch|network|failed to/i.test(m)) return "Sem conexão com o banco agora. Confira a internet e tente de novo.";
  return 'Algo deu errado com a tabela "' + tabela + '". Tente de novo em instantes.';
}
function ehErroDeCampo(erro) { var c = (erro && erro.code) || "", m = (erro && erro.message) || ""; return c === "42703" || c === "PGRST204" || /column/i.test(m); }

/* Busca uma tabela. Se a ordenação usar um campo que falta, tenta de novo sem ordenar. */
function busca(tabela, montar) {
  function roda(comMontagem) {
    var q = banco.from(tabela).select("*");
    if (comMontagem && montar) q = montar(q);
    return q;
  }
  return roda(true).then(function (r) {
    if (r.error && montar && ehErroDeCampo(r.error)) {
      avisa(explicaErro(tabela, r.error));
      return roda(false);
    }
    return r;
  }).then(function (r) {
    if (r.error) { avisa(explicaErro(tabela, r.error), "erro"); return { ok: false, dados: [] }; }
    return { ok: true, dados: r.data || [] };
  }).catch(function (e) { avisa(explicaErro(tabela, e), "erro"); return { ok: false, dados: [] }; });
}
function confereCampos(tabela, linhas, campos) {
  if (!linhas || !linhas.length) return;
  var falta = campos.filter(function (c) { return !(c in linhas[0]); });
  if (falta.length) avisa('A tabela "' + tabela + '" está sem ' + (falta.length > 1 ? "os campos: " : "o campo: ") + falta.join(", ") + ". Rode o " + arquivoSql(tabela) + " de novo para completar. O resto continua funcionando.");
}
function grava(tabela, promessa) {
  return promessa.then(function (r) {
    if (r.error) { avisa(explicaErro(tabela, r.error), "erro"); toast("Não salvou. Veja o aviso no topo."); return false; }
    return true;
  }).catch(function (e) { avisa(explicaErro(tabela, e), "erro"); toast("Não salvou. Veja o aviso no topo."); return false; });
}
function salva(tabela, dados, id) {
  var q = id ? banco.from(tabela).update(dados).eq("id", id) : banco.from(tabela).insert(dados);
  return grava(tabela, q).then(function (ok) { if (ok) toast(id ? "Alterado" : "Adicionado"); return ok; });
}
function apaga(tabela, id) {
  return grava(tabela, banco.from(tabela).delete().eq("id", id)).then(function (ok) { if (ok) toast("Apagado"); return ok; });
}

var toastTimer;
function toast(t) {
  var el = $(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = t; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 2200);
}

function baixaCSV(nome, cabecalho, linhas) {
  function q(v) { var s = v == null ? "" : String(v); return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  var texto = "﻿" + [cabecalho].concat(linhas).map(function (l) { return l.map(q).join(";"); }).join("\r\n");
  var blob = new Blob([texto], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

/* ---------- janela (modal) ---------- */
var modalAtual = null;
function abreModal(opcoes) {
  fechaModal();
  var fundo = document.createElement("div");
  fundo.className = "fundo-modal";
  fundo.innerHTML = '<div class="modal' + (opcoes.largo ? " largo" : "") + '" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">' +
    '<div class="modal-topo"><div><h2 id="modal-titulo">' + esc(opcoes.titulo) + "</h2>" + (opcoes.sub ? "<p>" + esc(opcoes.sub) + "</p>" : "") + "</div>" +
    '<button type="button" class="icone" data-fecha aria-label="Fechar">' + icone("x") + "</button></div>" +
    '<div class="modal-corpo"></div></div>';
  var corpo = $(".modal-corpo", fundo);
  if (typeof opcoes.corpo === "string") corpo.innerHTML = opcoes.corpo; else if (opcoes.corpo) corpo.appendChild(opcoes.corpo);
  var antes = document.activeElement;
  fundo.addEventListener("click", function (e) { if (e.target === fundo || e.target.closest("[data-fecha]")) fechaModal(); });
  function tecla(e) {
    if (e.key === "Escape") { fechaModal(); return; }
    if (e.key === "Tab") {
      var f = $$("button, a[href], input, select, textarea", fundo).filter(function (x) { return !x.disabled && x.offsetParent !== null; });
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  }
  document.addEventListener("keydown", tecla);
  document.body.appendChild(fundo);
  modalAtual = { fundo: fundo, tecla: tecla, antes: antes };
  var primeiro = $("input, select, textarea", corpo) || $("[data-fecha]", fundo);
  if (primeiro) primeiro.focus();
  return corpo;
}
function fechaModal() {
  if (!modalAtual) return;
  document.removeEventListener("keydown", modalAtual.tecla);
  modalAtual.fundo.remove();
  if (modalAtual.antes && modalAtual.antes.focus && document.contains(modalAtual.antes)) modalAtual.antes.focus();
  modalAtual = null;
}

/* Formulário genérico: monta os campos, confere o obrigatório e devolve os valores */
function formulario(op) {
  var v = op.valores || {};
  var form = document.createElement("form");
  form.noValidate = true;
  var html = '<div class="form-grade">';
  op.campos.forEach(function (c) {
    var id = "f-" + c.nome, val = v[c.nome];
    var classe = "campo" + (c.inteiro || c.tipo === "textarea" ? " inteiro" : "") + (c.tipo === "check" ? " check" : "");
    html += '<div class="' + classe + '">';
    if (c.tipo === "check") {
      html += '<label><input type="checkbox" id="' + id + '" name="' + c.nome + '"' + (val ? " checked" : "") + "> " + esc(c.rotulo) + "</label>";
    } else {
      html += '<label for="' + id + '">' + esc(c.rotulo) + (c.obrigatorio ? " *" : "") + "</label>";
      if (c.tipo === "select") {
        html += '<select id="' + id + '" name="' + c.nome + '">' + c.opcoes.map(function (o) {
          var ov = Array.isArray(o) ? o[0] : o, ot = Array.isArray(o) ? o[1] : o;
          return '<option value="' + esc(ov) + '"' + (String(val == null ? "" : val) === String(ov) ? " selected" : "") + ">" + esc(ot) + "</option>";
        }).join("") + "</select>";
      } else if (c.tipo === "textarea") {
        html += '<textarea id="' + id + '" name="' + c.nome + '" placeholder="' + esc(c.dica || "") + '">' + esc(val == null ? "" : val) + "</textarea>";
      } else {
        html += '<input id="' + id + '" name="' + c.nome + '" type="' + (c.tipo || "text") + '"' + (c.passo ? ' step="' + c.passo + '"' : "") + (c.tipo === "number" ? ' min="0" inputmode="decimal"' : "") +
          ' value="' + esc(val == null ? "" : val) + '" placeholder="' + esc(c.dica || "") + '">';
      }
    }
    html += "</div>";
  });
  html += '</div><p class="erro-form" hidden></p><div class="modal-pe">' +
    (op.aoApagar ? '<button type="button" class="btn perigo" data-apagar>' + icone("lixo") + "Apagar</button>" : "") +
    '<div class="dir"><button type="button" class="btn" data-fecha>Cancelar</button><button type="submit" class="btn escuro">Salvar</button></div></div>';
  form.innerHTML = html;
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var dados = {}, falta = null;
    op.campos.forEach(function (c) {
      var el = form.elements[c.nome];
      var x;
      if (c.tipo === "check") x = el.checked;
      else if (c.tipo === "number") x = el.value.trim() === "" ? 0 : numero(el.value.replace(",", "."));
      else { x = el.value.trim(); if (x === "" && (c.tipo === "date" || c.vazioNulo)) x = null; }
      if (c.obrigatorio && (x === null || x === "")) falta = falta || c;
      dados[c.nome] = x;
    });
    var erro = $(".erro-form", form);
    if (falta) { erro.textContent = 'Preencha o campo "' + falta.rotulo + '".'; erro.hidden = false; form.elements[falta.nome].focus(); return; }
    var btn = $('button[type="submit"]', form); btn.disabled = true;
    Promise.resolve(op.aoSalvar(dados)).then(function (ok) { btn.disabled = false; if (ok !== false) fechaModal(); });
  });
  if (op.aoApagar) {
    $("[data-apagar]", form).addEventListener("click", function () {
      if (!confirm(op.confirmaApagar || "Apagar este item? Não dá para desfazer.")) return;
      Promise.resolve(op.aoApagar()).then(function (ok) { if (ok !== false) fechaModal(); });
    });
  }
  abreModal({ titulo: op.titulo, sub: op.sub, corpo: form });
}

/* Arrastar pela alcinha (mouse e dedo) ou usar as setas do teclado */
function ligaArrasto(tbody) {
  var timer;
  function salvaOrdem() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      var ids = $$("tr", tbody).map(function (tr) { return tr.dataset.id; });
      var mudou = [];
      ids.forEach(function (id, i) {
        var v = E.videos.find(function (x) { return String(x.id) === id; });
        if (v && numero(v.ordem) !== i + 1) { v.ordem = i + 1; mudou.push(v); }
      });
      E.videos.sort(function (a, b) { return ids.indexOf(String(a.id)) - ids.indexOf(String(b.id)); });
      if (!mudou.length) return;
      Promise.all(mudou.map(function (v) { return grava("videos", banco.from("videos").update({ ordem: v.ordem }).eq("id", v.id)); }))
        .then(function (r) { if (r.every(Boolean)) toast("Ordem salva"); else carregaPortfolio(); });
    }, 350);
  }
  tbody.addEventListener("pointerdown", function (e) {
    var alca = e.target.closest(".alca"); if (!alca) return;
    e.preventDefault();
    var linha = alca.closest("tr"); linha.classList.add("arrastando");
    try { alca.setPointerCapture(e.pointerId); } catch (x) {}
    function mover(ev) {
      var alvo = document.elementFromPoint(ev.clientX, ev.clientY);
      var tr = alvo && alvo.closest("tr");
      if (!tr || tr === linha || tr.parentNode !== tbody) return;
      var r = tr.getBoundingClientRect();
      tbody.insertBefore(linha, ev.clientY > r.top + r.height / 2 ? tr.nextSibling : tr);
    }
    function soltar() {
      alca.removeEventListener("pointermove", mover); alca.removeEventListener("pointerup", soltar); alca.removeEventListener("pointercancel", soltar);
      linha.classList.remove("arrastando"); salvaOrdem();
    }
    alca.addEventListener("pointermove", mover); alca.addEventListener("pointerup", soltar); alca.addEventListener("pointercancel", soltar);
  });
  tbody.addEventListener("keydown", function (e) {
    var alca = e.target.closest(".alca"); if (!alca) return;
    var linha = alca.closest("tr");
    if (e.key === "ArrowUp" && linha.previousElementSibling) { e.preventDefault(); tbody.insertBefore(linha, linha.previousElementSibling); alca.focus(); salvaOrdem(); }
    else if (e.key === "ArrowDown" && linha.nextElementSibling) { e.preventDefault(); tbody.insertBefore(linha.nextElementSibling, linha); alca.focus(); salvaOrdem(); }
  });
}

}

function quandoTag(prazo, feito) {

      '<div class="dir"><button type="button" class="btn escuro" id="nova-ideia">' + icone("mais") + "Nova ideia</button></div></div>" +
      '<div id="quadro-ideias"><p class="vazio">Carregando...</p></div></div>';
    $("#nova-ideia").addEventListener("click", function () { editaIdeia(null); });
    $("#quadro-ideias").addEventListener("click", function (e) {
      var card = e.target.closest("[data-id]"); if (!card) return;
      var i = E.ideias.find(function (x) { return String(x.id) === card.dataset.id; }); if (!i) return;
      if (e.target.closest("[data-avanca]")) {
        var idx = STATUS_IDEIA.findIndex(function (x) { return x[0] === i.status; });
        var prox = STATUS_IDEIA[Math.min(idx + 1, STATUS_IDEIA.length - 1)][0];
        grava("ideias", banco.from("ideias").update({ status: prox }).eq("id", i.id)).then(function (ok) { if (ok) { i.status = prox; toast("Foi pra " + info(STATUS_IDEIA, prox)[1]); desenhaQuadro(); } });
      } else if (e.target.closest("[data-agenda]")) {
        editaItemCal(null, hojeISO(), { titulo: semEx(i.titulo), tipo: i.status === "gravado" ? "postar" : "gravar" });
      } else editaIdeia(i);
    });
    $("#quadro-ideias").addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.matches("[data-id]")) e.target.click(); });
  }
  busca("ideias", function (q) { return q.order("criado_em", { ascending: false }); }).then(seguro("ideias", function (r) {
    E.ideias = r.dados; E.ok.ideias = r.ok;
    confereCampos("ideias", E.ideias, ["titulo", "nicho", "formato", "gancho", "status", "obs"]);
    desenhaQuadro();
  }));
}
function desenhaQuadro() {
  var alvo = $("#quadro-ideias"); if (!alvo) return;
  if (!E.ok.ideias) { alvo.innerHTML = '<p class="vazio">Não consegui carregar as ideias. Veja o aviso no topo.</p>'; return; }
  alvo.innerHTML = '<div class="quadro">' + STATUS_IDEIA.map(function (st, k) {
    var lista = E.ideias.filter(function (i) { return (i.status || "ideia") === st[0]; });
    return '<div class="coluna"><h3>' + st[1] + " <span>" + lista.length + "</span></h3>" +
      (lista.length ? lista.map(function (i) {
        return '<article class="ideia-card" tabindex="0" data-id="' + esc(i.id) + '"><b>' + esc(semEx(i.titulo)) + tagEx(i.titulo) + "</b>" +
          (i.gancho ? "<p>" + esc(i.gancho) + "</p>" : "") +
          ((i.nicho || i.formato) ? '<div class="meta">' + (i.nicho ? '<span class="pilula p-verde">' + esc(i.nicho) + "</span>" : "") + (i.formato ? '<span class="pilula p-cinza">' + esc(i.formato) + "</span>" : "") + "</div>" : "") +
          '<div class="acoes-card">' + (st[0] !== "postado" ? '<button type="button" class="btn" data-agenda>Agendar</button><button type="button" class="btn" data-avanca>Mover pra ' + STATUS_IDEIA[k + 1][1] + "</button>" : "") + "</div></article>";
      }).join("") : '<p class="vazio">Vazio</p>') + "</div>";
  }).join("") + "</div>";
}
function editaIdeia(i) {
  var estruturas = (window.Biblioteca && window.Biblioteca.TIPOS || []).map(function (t) { return t.nome; });
  if (!estruturas.length) estruturas = FORMATOS.slice();
  if (i && i.formato && estruturas.indexOf(i.formato) < 0) estruturas.push(i.formato);
  formulario({
    titulo: i ? "Editar ideia" : "Nova ideia",
    valores: i || { status: "ideia", nicho: "", formato: "" },
    campos: [
      { nome: "titulo", rotulo: "Ideia", obrigatorio: true, inteiro: true },
      { nome: "gancho", rotulo: "Gancho (a primeira frase)", inteiro: true },
      { nome: "nicho", rotulo: "Nicho", tipo: "select", opcoes: [["", "Escolha"]].concat(NICHOS) },
      { nome: "formato", rotulo: "Estrutura de roteiro", tipo: "select", opcoes: [["", "Escolha"]].concat(estruturas) },
      { nome: "status", rotulo: "Etapa", tipo: "select", opcoes: STATUS_IDEIA },
      { nome: "obs", rotulo: "Anotações", tipo: "textarea" }
    ],
    aoSalvar: function (d) { return salva("ideias", d, i && i.id).then(function (ok) { if (ok) carregaIdeias(); return ok; }); },
    aoApagar: i ? function () { return apaga("ideias", i.id).then(function (ok) { if (ok) carregaIdeias(); return ok; }); } : null
  });
}

/* ---------- RADAR DE NOVIDADES ---------- */
var radarFiltro = { status: "ativas", cat: "", texto: "" };
function carregaRadar() {
  var s = $("#aba-radar");
  if (!s.dataset.pronto) {
    s.dataset.pronto = "1";
    s.innerHTML = '<div class="card bloco"><div class="bloco-topo"><h2>Onde procurar novidades</h2></div><div class="fontes">' +
      FONTES_RADAR.map(function (f) { return '<a href="' + esc(f[1]) + '" target="_blank" rel="noopener">' + esc(f[0]) + ' <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/></svg></a>'; }).join("") + "</div></div>" +
      '<div class="card bloco"><div class="bloco-topo">' +
      '<div class="seg" role="group" aria-label="Filtrar por situação" id="filtro-radar">' +
      [["ativas", "Ativas"], ["testar", "Quero testar"], ["usei", "Já usei"], ["arquivada", "Arquivadas"], ["todas", "Todas"]].map(function (f) { return '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (f[0] === radarFiltro.status) + '">' + f[1] + "</button>"; }).join("") + "</div>" +
      '<label class="sr-only" for="radar-cat">Categoria</label><select class="filtro" id="radar-cat"><option value="">Todas as categorias</option>' + CATEGORIAS_RADAR.map(function (c) { return "<option>" + esc(c) + "</option>"; }).join("") + "</select>" +
      '<label class="campo-busca">' + icone("busca") + '<span class="sr-only">Buscar novidade</span><input type="search" id="radar-busca" placeholder="Buscar"></label>' +
      '<div class="dir"><button type="button" class="btn escuro" id="nova-radar">' + icone("mais") + "Salvar novidade</button></div></div>" +
      '<div id="grade-radar"><p class="vazio">Carregando...</p></div></div>';
    $("#filtro-radar").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      radarFiltro.status = b.dataset.f;
      $$("#filtro-radar button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      desenhaRadar();
    });
    $("#radar-cat").addEventListener("change", function () { radarFiltro.cat = this.value; desenhaRadar(); });
    $("#radar-busca").addEventListener("input", function () { radarFiltro.texto = this.value; desenhaRadar(); });
    $("#nova-radar").addEventListener("click", function () { editaRadar(null); });
    var grade = $("#grade-radar");
    grade.addEventListener("click", function (e) {
      if (e.target.closest("a, select")) return;
      var card = e.target.closest("[data-id]"); if (!card) return;
      var n = E.radar.find(function (x) { return String(x.id) === card.dataset.id; }); if (!n) return;
      if (e.target.closest("[data-fixa]")) {
        var novo = !n.fixada;
        grava("radar", banco.from("radar").update({ fixada: novo }).eq("id", n.id)).then(function (ok) { if (ok) { n.fixada = novo; desenhaRadar(); } });
        return;
      }
      editaRadar(n);
    });
    grade.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.matches("[data-id]")) e.target.click(); });
    grade.addEventListener("change", function (e) {
      var sel = e.target.closest("[data-status]"); if (!sel) return;
      var n = E.radar.find(function (x) { return String(x.id) === sel.closest("[data-id]").dataset.id; }); if (!n) return;
      var antes = n.status;
      grava("radar", banco.from("radar").update({ status: sel.value }).eq("id", n.id)).then(function (ok) {
        if (!ok) { sel.value = antes; return; }
        n.status = sel.value; toast("Atualizado"); desenhaRadar();
      });
    });
  }
  busca("radar", function (q) { return q.order("criado_em", { ascending: false }); }).then(seguro("radar", function (r) {
    E.radar = r.dados; E.ok.radar = r.ok;
    confereCampos("radar", E.radar, ["titulo", "categoria", "link", "nota", "status", "fixada"]);
    desenhaRadar();
  }));
}
function desenhaRadar() {
  var alvo = $("#grade-radar"); if (!alvo) return;
  if (!E.ok.radar) { alvo.innerHTML = '<p class="vazio">Não consegui carregar o radar. Veja o aviso no topo.</p>'; return; }
  var t = radarFiltro.texto.trim().toLowerCase();
  var lista = E.radar.filter(function (n) {
    var st = n.status || "nova";
    if (radarFiltro.status === "ativas" && (st === "usei" || st === "arquivada")) return false;
    if (radarFiltro.status !== "ativas" && radarFiltro.status !== "todas" && st !== radarFiltro.status) return false;
    if (radarFiltro.cat && n.categoria !== radarFiltro.cat) return false;
    return !t || [n.titulo, n.nota].some(function (x) { return String(x || "").toLowerCase().indexOf(t) > -1; });
  }).sort(function (a, b) {
    if (!!a.fixada !== !!b.fixada) return a.fixada ? -1 : 1;
    return String(b.criado_em || "").localeCompare(String(a.criado_em || ""));
  });
  if (!E.radar.length) { alvo.innerHTML = '<p class="vazio">Seu radar está vazio. Viu uma tendência, um áudio ou uma novidade de plataforma? Clique em Salvar novidade.</p>'; return; }
  if (!lista.length) { alvo.innerHTML = '<p class="vazio">Nada com esse filtro.</p>'; return; }
  alvo.innerHTML = '<div class="grade-radar">' + lista.map(function (n) {
    var link = urlSegura(n.link);
    return '<article class="card radar-card' + (n.fixada ? " fixada" : "") + '" tabindex="0" data-id="' + esc(n.id) + '">' +
      '<div class="radar-topo"><span class="pilula ' + (COR_RADAR[n.categoria] || "p-cinza") + '">' + esc(n.categoria || "Outro") + "</span>" +
      '<button type="button" class="icone fixa" data-fixa aria-pressed="' + !!n.fixada + '" aria-label="' + (n.fixada ? "Desafixar" : "Fixar no topo") + '"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3-1-6zM12 15v6"/></svg></button></div>' +
      "<h3>" + esc(semEx(n.titulo)) + tagEx(n.titulo) + "</h3>" + (n.nota ? '<p class="nota">' + esc(n.nota) + "</p>" : "") +
      '<div class="radar-pe"><span class="fraco" style="font-size:.76rem">' + haQuanto(n.criado_em) + "</span>" +
      '<label class="sr-only" for="st-' + esc(n.id) + '">Situação</label><select id="st-' + esc(n.id) + '" data-status>' + STATUS_RADAR.map(function (s) { return '<option value="' + s[0] + '"' + ((n.status || "nova") === s[0] ? " selected" : "") + ">" + s[1] + "</option>"; }).join("") + "</select>" +
      (link ? '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener">Abrir</a>' : "") + "</div></article>";
  }).join("") + "</div>";
}
function editaRadar(n) {
  formulario({
    titulo: n ? "Editar novidade" : "Salvar novidade",
    valores: n || { categoria: "Tendência", status: "nova" },
    campos: [
      { nome: "titulo", rotulo: "O que é", obrigatorio: true, inteiro: true },
      { nome: "categoria", rotulo: "Categoria", tipo: "select", opcoes: CATEGORIAS_RADAR },
      { nome: "status", rotulo: "Situação", tipo: "select", opcoes: STATUS_RADAR },
      { nome: "link", rotulo: "Link (onde viu)", tipo: "url", inteiro: true, vazioNulo: true, dica: "https://..." },
      { nome: "nota", rotulo: "Anotação: o que é e como você poderia usar", tipo: "textarea" },
      { nome: "fixada", rotulo: "Fixar no topo", tipo: "check", inteiro: true }
    ],
    aoSalvar: function (d) { if (d.link) d.link = urlSegura(d.link) || null; return salva("radar", d, n && n.id).then(function (ok) { if (ok) carregaRadar(); return ok; }); },
    aoApagar: n ? function () { return apaga("radar", n.id).then(function (ok) { if (ok) carregaRadar(); return ok; }); } : null
  });
}

/* ---------- LINKS ÚTEIS ---------- */
var linksBusca = "";
function carregaLinks() {
  var s = $("#aba-links");
  if (!s.dataset.pronto) {
    s.dataset.pronto = "1";
    s.innerHTML = '<div class="card bloco"><div class="bloco-topo">' +
      '<label class="campo-busca">' + icone("busca") + '<span class="sr-only">Buscar link</span><input type="search" id="links-busca" placeholder="Buscar link"></label>' +
      '<span class="contagem" id="conta-links"></span>' +
      '<div class="dir"><button type="button" class="btn escuro" id="novo-link">' + icone("mais") + "Adicionar link</button></div></div></div>" +
      '<div id="grupos-links"><p class="vazio">Carregando...</p></div>';
    $("#links-busca").addEventListener("input", function () { linksBusca = this.value; desenhaLinks(); });
    $("#novo-link").addEventListener("click", function () { editaLink(null); });
    $("#grupos-links").addEventListener("click", function (e) {
      var li = e.target.closest("[data-id]"); if (!li) return;
      var l = E.links.find(function (x) { return String(x.id) === li.dataset.id; }); if (!l) return;
      if (e.target.closest("[data-fav]")) {
        var novo = !l.favorito;
        grava("links", banco.from("links").update({ favorito: novo }).eq("id", l.id)).then(function (ok) { if (ok) { l.favorito = novo; desenhaLinks(); } });
      } else if (e.target.closest("[data-edita]")) editaLink(l);
    });
  }
  busca("links", function (q) { return q.order("titulo", { ascending: true }); }).then(seguro("links", function (r) {
    E.links = r.dados; E.ok.links = r.ok;
    confereCampos("links", E.links, ["titulo", "url", "categoria", "descricao", "favorito"]);
    desenhaLinks();
  }));
}
function desenhaLinks() {
  var alvo = $("#grupos-links"); if (!alvo) return;
  if (!E.ok.links) { alvo.innerHTML = '<div class="card bloco"><p class="vazio">Não consegui carregar os links. Veja o aviso no topo.</p></div>'; $("#conta-links").textContent = ""; return; }
  var t = linksBusca.trim().toLowerCase();
  var lista = E.links.filter(function (l) { return !t || [l.titulo, l.url, l.descricao, l.categoria].some(function (x) { return String(x || "").toLowerCase().indexOf(t) > -1; }); });
  $("#conta-links").textContent = lista.length + (lista.length === 1 ? " link" : " links");
  if (!E.links.length) { alvo.innerHTML = '<div class="card bloco"><p class="vazio">Nenhum link ainda. Clique em Adicionar link para guardar os sites que você usa no trabalho.</p></div>'; return; }
  if (!lista.length) { alvo.innerHTML = '<div class="card bloco"><p class="vazio">Nenhum link com essa busca.</p></div>'; return; }
  var grupos = [];
  var favs = lista.filter(function (l) { return l.favorito; });
  if (favs.length) grupos.push(["★ Favoritos", favs]);
  var cats = CATEGORIAS_LINK.concat(lista.map(function (l) { return l.categoria || "Outros"; }).filter(function (c, i, a) { return CATEGORIAS_LINK.indexOf(c) < 0 && a.indexOf(c) === i; }));
  cats.forEach(function (c) {
    var itens = lista.filter(function (l) { return (l.categoria || "Outros") === c; });
    if (itens.length) grupos.push([c, itens]);
  });
  alvo.innerHTML = '<div class="grupos-links">' + grupos.map(function (g) {
    return '<section class="card"><h2>' + esc(g[0]) + " <span>" + g[1].length + '</span></h2><ul>' + g[1].map(function (l) {
      var url = urlSegura(l.url), nome = semEx(l.titulo) || hostDe(l.url);
      return '<li class="link-li" data-id="' + esc(l.id) + '"><span class="letra" aria-hidden="true">' + esc((nome.charAt(0) || "?").toUpperCase()) + "</span>" +
        "<div>" + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(nome) + "</a>" : "<b>" + esc(nome) + "</b>") + tagEx(l.titulo) +
        "<small>" + esc(l.descricao || hostDe(l.url)) + "</small></div>" +
        '<button type="button" class="icone estrela" data-fav aria-pressed="' + !!l.favorito + '" aria-label="' + (l.favorito ? "Tirar dos favoritos" : "Favoritar") + '">' + icone("estrela") + "</button>" +
        '<button type="button" class="icone" data-edita aria-label="Editar link">' + icone("lapis") + "</button></li>";
    }).join("") + "</ul></section>";
  }).join("") + "</div>";
}
function editaLink(l) {
  formulario({
    titulo: l ? "Editar link" : "Adicionar link",
    valores: l || { categoria: "Ferramentas" },
    campos: [
      { nome: "titulo", rotulo: "Nome", obrigatorio: true },
      { nome: "categoria", rotulo: "Categoria", tipo: "select", opcoes: (l && l.categoria && CATEGORIAS_LINK.indexOf(l.categoria) < 0) ? CATEGORIAS_LINK.concat([l.categoria]) : CATEGORIAS_LINK },
      { nome: "url", rotulo: "Endereço", tipo: "url", obrigatorio: true, inteiro: true, dica: "https://..." },
      { nome: "descricao", rotulo: "Pra que serve", inteiro: true },
      { nome: "favorito", rotulo: "Favorito", tipo: "check", inteiro: true }
    ],
    aoSalvar: function (d) {
      d.url = urlSegura(d.url);
      if (!d.url) { toast("Esse endereço não parece um site. Comece com https://"); return false; }
      return salva("links", d, l && l.id).then(function (ok) { if (ok) carregaLinks(); return ok; });
    },
    aoApagar: l ? function () { return apaga("links", l.id).then(function (ok) { if (ok) carregaLinks(); return ok; }); } : null
  });
}
</script>
</body>
