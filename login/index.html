<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar | Painel Yukie Yahiro</title>
<meta name="description" content="Acesso ao painel da Yukie Yahiro.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c6f24e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f2; --card:#fff; --ink:#111; --muted:#4d524b; --line:#e2e4df;
  --lime:#c6f24e; --lime-deep:#a9d62c; --lime-soft:#eefbc9;
  --erro-bg:#fdecec; --erro:#a3161a; --ok-bg:#eefbc9; --ok:#2f4a00;
  --radius:22px;
  --shadow:0 1px 2px rgba(17,17,17,.05),0 18px 40px -16px rgba(17,17,17,.22);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.cartao{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px}
.topo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:.95rem;margin-bottom:18px}
.ponto{width:12px;height:12px;border-radius:50%;background:var(--lime);border:2px solid var(--ink)}
h1{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.88rem}
.faixa{border-radius:12px;padding:10px 12px;font-weight:600;font-size:.86rem;margin-bottom:14px}
.faixa.erro{background:var(--erro-bg);color:var(--erro)}
.faixa.ok{background:var(--ok-bg);color:var(--ok)}
.faixa[hidden]{display:none}
label{display:block;font-weight:700;font-size:.84rem;margin-bottom:6px}
input{width:100%;font:inherit;color:inherit;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;margin-bottom:14px}
input:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px var(--lime)}
.btn{width:100%;font:inherit;font-weight:800;min-height:44px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.link{display:inline-block;margin-top:14px;background:none;border:0;padding:0;font:inherit;font-size:.86rem;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
.btn:focus-visible{box-shadow:0 0 0 6px var(--lime)}
.voltar{display:block;text-align:center;margin-top:16px;font-size:.82rem;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="cartao">
  <div class="topo"><span class="ponto" aria-hidden="true"></span>Painel Yukie Yahiro</div>

  <!-- ENTRAR -->
  <section id="tela-entrar" aria-labelledby="t-entrar">
    <h1 id="t-entrar">Entrar</h1>
    <p class="sub">Acesso só da Yukie.</p>
    <p class="faixa erro" id="erro" role="alert" hidden></p>
    <p class="faixa ok" id="aviso" role="status" hidden></p>
    <form id="form-entrar" novalidate>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" id="btn-entrar">Entrar</button>
    </form>
    <button class="link" type="button" id="esqueci">Esqueci minha senha</button>
  </section>

  <!-- NOVA SENHA (aparece quando você chega pelo link do e-mail de recuperação) -->
  <section id="tela-nova" aria-labelledby="t-nova" hidden>
    <h1 id="t-nova">Criar nova senha</h1>
    <p class="sub">Escolha uma senha com pelo menos 8 caracteres.</p>
    <p class="faixa erro" id="erro-nova" role="alert" hidden></p>
    <form id="form-nova" novalidate>
      <label for="nova">Nova senha</label>
      <input id="nova" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn" type="submit" id="btn-nova">Salvar e entrar</button>
    </form>
  </section>

  <a class="voltar" href="../">Voltar para o portfólio</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/banco.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var banco = window.banco;
  var PAINEL = "../admin/";

  function mostra(el, texto) { el.textContent = texto; el.hidden = !texto; }

  /* Traduz os erros do Supabase (que vêm em inglês) para português */
  function traduz(erro) {
    var m = ((erro && (erro.code || "")) + " " + (erro && erro.message || "")).toLowerCase();
    if (m.indexOf("invalid") > -1 && (m.indexOf("credential") > -1 || m.indexOf("login") > -1)) return "E-mail ou senha incorretos";
    if (m.indexOf("not confirmed") > -1) return "Esse e-mail ainda não foi confirmado no Supabase.";
    if (m.indexOf("rate") > -1 || m.indexOf("too many") > -1) return "Muitas tentativas seguidas. Espere um minutinho e tente de novo.";
    if (m.indexOf("weak") > -1 || m.indexOf("at least") > -1) return "Essa senha é fraca. Use pelo menos 8 caracteres.";
    if (m.indexOf("same") > -1) return "A nova senha precisa ser diferente da antiga.";
    if (m.indexOf("fetch") > -1 || m.indexOf("network") > -1) return "Não consegui conectar. Confira a sua internet.";
    return "Não deu certo agora. Tente de novo em instantes.";
  }

  if (!banco) {
    mostra($("#erro"), "Não consegui carregar o sistema de login. Confira a internet e recarregue a página.");
    $("#btn-entrar").disabled = true;
    return;
  }

  /* Chegou pelo link do e-mail de recuperação? Mostra a tela de nova senha. */
  var veioRecuperar = location.hash.indexOf("type=recovery") > -1;
  function abreNovaSenha() { $("#tela-entrar").hidden = true; $("#tela-nova").hidden = false; $("#nova").focus(); }
  if (veioRecuperar) abreNovaSenha();
  banco.auth.onAuthStateChange(function (evento) { if (evento === "PASSWORD_RECOVERY") abreNovaSenha(); });

  /* Já tem sessão aberta? Vai direto pro painel. */
  if (!veioRecuperar) {
    banco.auth.getSession().then(function (r) {
      if (r.data && r.data.session) location.replace(PAINEL);
    });
  }

  /* Entrar */
  $("#form-entrar").addEventListener("submit", function (e) {
    e.preventDefault();
    mostra($("#erro"), ""); mostra($("#aviso"), "");
    var email = $("#email").value.trim(), senha = $("#senha").value;
    if (!email || !senha) { mostra($("#erro"), "Preencha o e-mail e a senha."); return; }
    var btn = $("#btn-entrar"); btn.disabled = true; btn.textContent = "Entrando...";
    banco.auth.signInWithPassword({ email: email, password: senha }).then(function (r) {
      if (r.error) { mostra($("#erro"), traduz(r.error)); btn.disabled = false; btn.textContent = "Entrar"; return; }
      location.replace(PAINEL);
    }).catch(function (err) { mostra($("#erro"), traduz(err)); btn.disabled = false; btn.textContent = "Entrar"; });
  });

  /* Esqueci minha senha */
  $("#esqueci").addEventListener("click", function () {
    mostra($("#erro"), ""); mostra($("#aviso"), "");
    var email = $("#email").value.trim();
    if (!email) { mostra($("#erro"), "Escreva o seu e-mail no campo acima e clique de novo em Esqueci minha senha."); $("#email").focus(); return; }
    var volta = location.origin + location.pathname;
    banco.auth.resetPasswordForEmail(email, { redirectTo: volta }).then(function (r) {
      if (r.error) { mostra($("#erro"), traduz(r.error)); return; }
      mostra($("#aviso"), "Pronto! Se esse e-mail tiver acesso, chega um link pra criar uma senha nova. Olhe também o spam.");
    }).catch(function (err) { mostra($("#erro"), traduz(err)); });
  });

  /* Salvar nova senha */
  $("#form-nova").addEventListener("submit", function (e) {
    e.preventDefault();
    mostra($("#erro-nova"), "");
    var senha = $("#nova").value;
    if (senha.length < 8) { mostra($("#erro-nova"), "Use pelo menos 8 caracteres."); return; }
    var btn = $("#btn-nova"); btn.disabled = true;
    banco.auth.updateUser({ password: senha }).then(function (r) {
      if (r.error) { mostra($("#erro-nova"), traduz(r.error)); btn.disabled = false; return; }
      location.replace(PAINEL);
    }).catch(function (err) { mostra($("#erro-nova"), traduz(err)); btn.disabled = false; });
  });
})();
</script>
</body>
</html>
